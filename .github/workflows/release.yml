# Release：打 v* tag 时构建服务端多平台包、原生客户端与 GHCR 镜像，并挂到 GitHub Release。
#
# 产物命名：
#   driftclip-server-<os>-<arch>.zip/tar.gz  服务端 + web/dist + 示例配置
#   DriftClip-<platform>.<ext>               原生客户端
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # 服务端：Web 产物构建一次，随后交叉编译各平台二进制并打包。
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
          - { goos: windows, goarch: amd64, ext: .zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build server binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        working-directory: server
        run: go build -o /tmp/out/driftclip-server${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/driftclip-server
      - name: Package
        run: |
          cd /tmp/out
          # 保持 web/dist 目录名：服务端默认静态目录是相对路径 web/dist，
          # 解包后直接运行即可同时获得 API 与 Web UI。
          mkdir -p web
          cp -r "$GITHUB_WORKSPACE/web/dist" ./web/
          cp "$GITHUB_WORKSPACE/deploy/config.example.yaml" .
          name="driftclip-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.ext }}" = ".zip" ]; then
            zip -r "$name.zip" .
          else
            tar czf "$name.tar.gz" driftclip-server* web config.example.yaml
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: /tmp/out/driftclip-server-*.*

  # GHCR 镜像：复用 deploy/Dockerfile（多阶段，内含 Web 与 Go 构建）。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 桌面客户端：Windows / macOS(Apple Silicon) / Linux。
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64 }
          - { os: macos-latest, platform: macos-arm64 }
          - { os: ubuntu-latest, platform: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # tray_manager 依赖 ayatana-appindicator3（系统托盘）。
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev
      - run: flutter pub get
        working-directory: client
      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: client
        run: flutter build windows --release
      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: client
        run: flutter build macos --release
      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: client
        run: flutter build linux --release
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path client/build/windows/x64/runner/Release/* -DestinationPath DriftClip-${{ matrix.platform }}.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        # 产物名跟随 Xcode 工程（当前为 driftclip_client.app），用通配符避免硬编码。
        run: cd client/build/macos/Build/Products/Release && ditto -c -k --keepParent *.app "$OLDPWD/DriftClip-${{ matrix.platform }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf DriftClip-${{ matrix.platform }}.tar.gz -C client/build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: dist-client-${{ matrix.platform }}
          path: DriftClip-${{ matrix.platform }}.*

  # Android APK（debug 签名，可直接安装）。
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - run: flutter build apk --release
        working-directory: client
      - uses: actions/upload-artifact@v7
        with:
          name: dist-client-android
          path: client/build/app/outputs/flutter-apk/app-release.apk

  # 汇总产物并创建 GitHub Release。
  publish:
    needs: [server, docker, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # 所有构建产物统一 dist- 前缀；排除 docker buildx 的 gha 缓存
          # artifact（形如 owner~repo~XXX.dockerbuild，会导致 v4 下载失败）。
          pattern: 'dist-*'
          merge-multiple: true
          path: assets
      - name: Rename Android APK
        run: mv assets/app-release.apk assets/DriftClip-android.apk 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            - `driftclip-server-*`: server binary + web UI + example config (run from the bundle directory)
            - `DriftClip-*`: native clients (macOS builds are unsigned; see README for the Gatekeeper note)
            - Docker image: `ghcr.io/jeckchen666/driftclip:${{ github.ref_name }}`
          files: assets/*
